#cloud-config
package_update: true
package_upgrade: false

# The rocky-9-ci-template image ships a baked-in
# /etc/ssh/sshd_config.d/50-cloud-init.conf with "PasswordAuthentication no"
# (from the template build at 2025-04-27). Without this line kolla bootstrap
# (ansible_password / sshpass) cannot log in on fresh nodes.
ssh_pwauth: true


runcmd:
  - |
    cat > /etc/motd <<'EOF'
    Welcome!

    This system was provisioned using cloud-init.
    Some initialization tasks may still be running.

    To check status:
      cloud-init status
      tail -f /var/log/cloud-init.log
      tail -f /var/log/cloud-init-output.log
      cloud-init status --wait

    EOF

final_message: |
  Cloud-init finished.
  If this is your first login, please verify cloud-init status.
  To check status:
    cloud-init status
      sudo tail -f /var/log/cloud-init.log
      sudo tail -f /var/log/cloud-init-output.log
      cloud-init status --wait
