#cloud-config
hostname: ${hostname}
fqdn: ${fqdn}
manage_etc_hosts: true
create_hostname_file: true
preserve_hostname: false
ssh_pwauth: true
package_update: true
package_upgrade: false

packages:
  - podman
  - lvm2
  - chrony
  - curl
  - jq

runcmd:
  - systemctl enable --now chronyd
  - |
    cat > /etc/motd <<'EOF'
    Welcome!

    This system was provisioned using cloud-init (Ceph OSD node).
    Some initialization tasks may still be running.

    To check status:
      cloud-init status
      tail -f /var/log/cloud-init.log
      tail -f /var/log/cloud-init-output.log
      cloud-init status --wait
    EOF

final_message: |
  Cloud-init finished.

  If this is your first login, please verify:
    cloud-init status
    tail -f /var/log/cloud-init.log
    tail -f /var/log/cloud-init-output.log
    cloud-init status --wait